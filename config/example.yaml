lookupKeys:
  - checkpoint
  - vae
  - embeddings
  - hypernetworks
  - lora
  - controlnet

destination:
  checkpoint: /srv/stable-diffusion/models/Stable-diffusion
  vae: /srv/stable-diffusion/models/VAE
  embeddings: /srv/stable-diffusion/embeddings
  hypernetworks: /srv/stable-diffusion/models/hypernetworks
  lora: /srv/stable-diffusion/models/Lora
  controlnet: /srv/stable-diffusion/models/ControlNet

source:
  checkpoint:
    - meta:
        enabled: true
      baseDirectory: /srv/models/checkpoints/primary
      weightsList:
        - example-primary.safetensors
      ignoreList: []
    - meta:
        enabled: true
      baseDirectory: /srv/models/checkpoints/secondary
      weightsList:
        - example-secondary.safetensors
      ignoreList: []
    - meta:
        enabled: false
      baseDirectory: /srv/models/checkpoints/archive
      weightsList:
        - example-archived.safetensors
      ignoreList: []
  vae: []
  embeddings: []
  hypernetworks: []
  lora: []
  controlnet: []

